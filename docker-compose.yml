services:
  redis:
    image: redis:7-alpine
    container_name: cohobby-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    image: your-docker-id/cohobby-agent:latest
    container_name: cohobby-agent
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8080"   # 브라우저에서는 :8000으로 접속
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - ./chroma_db:/app/chroma_db

volumes:
  redis-data:
