services:
  redis:
    image: redis:7-alpine
    container_name: cohobby-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-data-lookup:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    container_name: mcp-data-lookup
    env_file:
      - .env
    ports:
      - "${MCP_PORT:-8765}:8765"
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    container_name: cohobby-agent
    depends_on:
      - redis
      - mcp-data-lookup
    ports:
      - "${AGENT_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_DATA_LOOKUP_URL: http://mcp-data-lookup:8765
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}

volumes:
  redis-data:
