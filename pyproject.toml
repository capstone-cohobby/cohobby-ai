[tool.poetry]
name = "cohobby-ai"
version = "0.1.0"
description = "Cohobby AI MCP-based orchestration system"
authors = ["Kang SungGyeong <you@example.com>"]
readme = "README.md"
license = "MIT"

# src 레이아웃 채택: src/ 아래 모든 패키지를 발견
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# --- Core ---
langchain = "^0.3.12"
langchain-community = "^0.3.25"
langchain-anthropic = "0.3.21"      # Claude 연동 (LangChain)
anthropic = ">=0.37.0"
langgraph = "^0.2.26"

httpx = "^0.28.1"
pydantic = "^2.8.0"
python-dotenv = "^1.0.1"
typer = "^0.12.3"
tenacity = "^8.2.3"
numpy = "^2.1.0"

# --- Search / RAG ---
elasticsearch = "^8.14.0"
tavily-python = "^0.5.0"

# --- MCP 서버 (FastAPI 권장) ---
fastapi = "^0.115.0"
uvicorn = ">=0.31.1"

# --- 기타 유틸 (있으면 사용) ---
fastmcp = "^2.12.4"     # 사용 중이라면 유지
boto3   = "^1.35"
botocore = "^1.35"
redis = "^6.4.0"
mcp = "^1.17.0"
websockets = "^14"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.8"
black = "^24.8.0"
mypy = "^1.10.0"
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
zstandard = "==0.25.0"

[tool.poetry.scripts]
# MCP 서버 엔트리 
mcp-datalookup = "src.cohobby_mcp.servers.datalookup.server:main"

# Agent 실행 엔트리
cohobby-agent  = "main:cli"   # src/main.py 안의 cli()

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# -------------------------------
# Lint/Format/Type-Check 설정
# -------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

# (경고 해결: lint 섹션으로 이전)
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP038"]   # 3.10/3.11에서 isinstance 튜플 유지

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
# src 레이아웃 맞춤
mypy_path = ["src"]
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
