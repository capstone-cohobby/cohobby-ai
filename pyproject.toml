[tool.poetry]
name = "cohobby-ai"
version = "0.1.0"
description = "Cohobby AI MCP-based orchestration system"
authors = ["Kang SungGyeong <you@example.com>"]
readme = "README.md"
license = "MIT"

# src 레이아웃 채택: src/ 아래 모든 패키지를 발견
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# --- Core ---
langchain = "^0.3.12"
langchain-community = "^0.3.25"
langchain-anthropic = "0.3.21"      # Claude 연동 (LangChain)

httpx = "^0.28.1"
pydantic = "^2.8.0"
python-dotenv = "^1.0.1"
typer = "^0.12.3"
tenacity = "^8.2.3"
numpy = "^2.1.0"

# --- MCP 서버 (FastAPI 권장) ---
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

# --- 기타 유틸 (있으면 사용) ---
scrapy = "^2.13.3"      # 선택
fastmcp = "^2.12.4"     # 사용 중이라면 유지
anthropic = "0.69"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.8"
black = "^24.8.0"
mypy = "^1.10.0"
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"

[tool.poetry.scripts]
# MCP 서버 엔트리 (추천: 우리가 정의한 경로에 맞춰 조정)
mcp-datalookup = "src.mcp.servers.datalookup.server:main"
mcp-pricing    = "mcp.servers.pricing.app:cli"
mcp-events     = "mcp.servers.events.app:cli"

# Agent 실행 엔트리
cohobby-agent  = "main:cli"   # src/main.py 안의 cli()

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# -------------------------------
# Lint/Format/Type-Check 설정
# -------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

# (경고 해결: lint 섹션으로 이전)
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP038"]   # 3.10/3.11에서 isinstance 튜플 유지

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
# src 레이아웃 맞춤
mypath = ["src"]
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
