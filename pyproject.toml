[tool.poetry]
name = "cohobby-ai"
version = "0.1.0"
description = "Cohobby AI MCP-based orchestration system"
authors = ["Kang SungGyeong <you@example.com>"]
readme = "README.md"
packages = [
  { include = "orchestrator",   from = "apps" },
  { include = "mcp_datalookup", from = "apps" },
  { include = "mcp_pricing",    from = "apps" },
  { include = "mcp_stats",      from = "apps" }
]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# --- Core ---
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langchain-openai = "^0.2.0"
fastmcp = "^2.12.4"               # FastMCP Python SDK
httpx = "^0.28.1"
pydantic = "^2.8.0"
tenacity = "^9.0.0"
typer = "^0.12.3"
python-dotenv = "^1.0.1"

# --- Optional / Runtime ---
uvicorn = { version = "^0.30.0", optional = true }

[tool.poetry.extras]
server = ["uvicorn"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.10.0"
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"

[tool.poetry.scripts]
# 각 MCP 서버 실행 명령
mcp-datalookup = "apps.mcp_datalookup.adapters.server:main"
mcp-pricing = "apps.mcp_pricing.server:main"
mcp-stats = "apps.mcp_stats.server:main"

# 오케스트레이터 실행 명령
orchestrator = "orchestrator.src.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# -------------------------------
# Lint/Format/Type-Check 설정
# -------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
